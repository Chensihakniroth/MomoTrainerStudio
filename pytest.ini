[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
# tests/probes/ holds one-off diagnostic scripts from the injection work,
# not pytest suites. Several open processes or call sys.exit() at import
# time, which crashes collection outright with an INTERNALERROR
# ("SystemExit: RobloxPlayerBeta not found"). Run them by hand instead:
#     python tests/probes/test_diagnose.py
norecursedirs = probes
